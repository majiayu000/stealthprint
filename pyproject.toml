[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthprint"
version = "0.1.0"
description = "Fingerprint OpenAI-compatible stealth models: tokenizer differential, context limit, error envelopes, vision ground truth. Model-agnostic, multilingual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.15", "tiktoken>=0.7"]
vision = ["pillow>=10.0"]
all = ["tokenizers>=0.15", "tiktoken>=0.7", "pillow>=10.0"]

[project.scripts]
stealthprint = "stealthprint.cli:main"

[tool.setuptools]
packages = ["stealthprint"]

[tool.setuptools.package-data]
stealthprint = ["data/probes.json"]
